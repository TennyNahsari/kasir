<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Locations API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background-color: #3b82f6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #2563eb;
        }
        pre {
            background-color: #f3f4f6;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .error {
            color: #dc2626;
        }
        .success {
            color: #16a34a;
        }
    </style>
</head>
<body>
    <h1>Test Locations API</h1>
    
    <div>
        <h2>Test GET /api/locations</h2>
        <button onclick="testGetLocations()">Test Get Locations</button>
        <button onclick="testAddLocation()">Test Add Location</button>
    </div>
    
    <div id="result"></div>

    <script>
        const API_URL = 'http://localhost:8000/api';
        
        async function testGetLocations() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Loading...</p>';
            
            try {
                const response = await fetch(`${API_URL}/locations?per_page=100`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h3 class="success">✅ Success! Status: ${response.status}</h3>
                    <p><strong>Total Locations:</strong> ${data.data ? data.data.length : (Array.isArray(data) ? data.length : 0)}</p>
                    <h4>Response:</h4>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3 class="error">❌ Error!</h3>
                    <pre>${error.message}</pre>
                `;
            }
        }
        
        async function testAddLocation() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Adding test location...</p>';
            
            const testLocation = {
                code: 'TEST-' + Date.now(),
                name: 'Test Location ' + new Date().toLocaleString(),
                type: 'OUTLET',
                address: 'Test Address 123',
                phone: '081234567890',
                person_in_charge: 'Test Person',
                is_active: true
            };
            
            try {
                const response = await fetch(`${API_URL}/locations`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify(testLocation)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <h3 class="success">✅ Location Created! Status: ${response.status}</h3>
                        <h4>Created Location:</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h3 class="error">❌ Failed! Status: ${response.status}</h3>
                        <h4>Error Response:</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3 class="error">❌ Error!</h3>
                    <pre>${error.message}</pre>
                `;
            }
        }
    </script>
</body>
</html>
