# SUPER SIMPLE CONFIG - API via reverse proxy, no fastcgi complexity
server {
    listen 80;
    server_name tazkia-inv.duckdns.org;
    
    # Proxy /api and /sanctum to Laravel running on port 8080
    location ~ ^/(api|sanctum) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Inventory App
    location / {
        alias /var/www/kasir-web/inventory-app/dist/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/kasir-web/inventory-app/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Instructions to use this config:
# 1. Start Laravel backend: cd /var/www/kasir-web/backend && nohup php artisan serve --host=127.0.0.1 --port=8080 &
# 2. Copy this file: sudo cp nginx-proxy.conf /etc/nginx/sites-available/tazkia-inv
# 3. Restart nginx: sudo systemctl restart nginx
# 4. Test: curl http://localhost/api/locations
