# Nginx Configuration for Dual Apps Deployment
# Domain: tazkia-inv.duckdns.org
# Apps: Inventory (/), POS/Kasir (/kasir)
# Shared: Backend API (/api), Database

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name tazkia-inv.duckdns.org;
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tazkia-inv.duckdns.org;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/tazkia-inv.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tazkia-inv.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    # Logging
    access_log /var/log/nginx/tazkia-inv-access.log;
    error_log /var/log/nginx/tazkia-inv-error.log;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Root directory
    root /var/www/tazkia-inv;
    index index.html index.php;
    
    # Max upload size
    client_max_body_size 20M;
    
    # INVENTORY APP - Root Path (/)
    location / {
        alias /var/www/tazkia-inv/inventory-app/dist/;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        
        # Handle static assets with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            alias /var/www/tazkia-inv/inventory-app/dist/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # POS/KASIR APP - Sub-path (/kasir)
    location /kasir {
        alias /var/www/tazkia-inv/frontend/dist/;
        try_files $uri $uri/ /kasir/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        
        # Handle static assets with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            alias /var/www/tazkia-inv/frontend/dist/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # BACKEND API - Shared by both apps (/api)
    location /api {
        alias /var/www/tazkia-inv/backend/public;
        try_files $uri $uri/ @laravel;
        
        # PHP processing
        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/tazkia-inv/backend/public/index.php;
            fastcgi_param SCRIPT_NAME /api/index.php;
            include fastcgi_params;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }
    
    # Laravel rewrite for API
    location @laravel {
        rewrite /api/(.*)$ /api/index.php?/$1? last;
    }
    
    # Storage files (uploads, images, etc.)
    location /storage {
        alias /var/www/tazkia-inv/backend/storage/app/public;
        access_log off;
        expires max;
        add_header Cache-Control "public";
    }
    
    # Block access to sensitive files
    location ~ /\. {
        deny all;
    }
    
    location ~ /\.env {
        deny all;
    }
    
    # Block access to vendor and node_modules
    location ~ /(vendor|node_modules) {
        deny all;
    }
}
