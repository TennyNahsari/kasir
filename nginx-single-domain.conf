# Nginx Configuration Template - Single Domain
# File: /etc/nginx/sites-available/kasir-pos
#
# Frontend dan Backend dalam satu domain
# Frontend: https://yourdomain.com/
# Backend API: https://yourdomain.com/api/
#
# CARA PAKAI:
# 1. Copy file ini ke /etc/nginx/sites-available/kasir-pos
# 2. Ganti 'yourdomain.com' dengan domain Anda
# 3. Ganti '/var/www/kasir-pos' dengan path project Anda
# 4. sudo ln -s /etc/nginx/sites-available/kasir-pos /etc/nginx/sites-enabled/
# 5. sudo nginx -t
# 6. sudo systemctl restart nginx

# HTTP - Redirect ke HTTPS (uncomment setelah install SSL)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name yourdomain.com www.yourdomain.com;
#     return 301 https://$server_name$request_uri;
# }

# HTTP Server (gunakan ini jika belum ada SSL)
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;
    
    root /var/www/kasir-pos/frontend/dist;
    index index.html;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Max upload size
    client_max_body_size 50M;
    
    # Frontend - Vue.js SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Backend API - Laravel
    location /api {
        alias /var/www/kasir-pos/backend/public;
        try_files $uri $uri/ @backend;
        
        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/kasir-pos/backend/public/index.php;
            include fastcgi_params;
            
            # Prevent timeout for long requests
            fastcgi_read_timeout 300;
        }
    }
    
    location @backend {
        rewrite /api/(.*)$ /index.php?/$1 last;
    }
    
    # Storage files (uploads)
    location /storage {
        alias /var/www/kasir-pos/backend/storage/app/public;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to PHP files in storage
    location ~ ^/storage/.*\.php$ {
        deny all;
    }
    
    # Logging
    access_log /var/log/nginx/kasir-pos-access.log;
    error_log /var/log/nginx/kasir-pos-error.log;
}

