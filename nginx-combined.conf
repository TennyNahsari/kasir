server {
    listen 80;
    listen [::]:80;
    server_name tazkia-inv.duckdns.org;
    
    # Logging
    access_log /var/log/nginx/tazkia-inv_access.log;
    error_log /var/log/nginx/tazkia-inv_error.log;
    
    # Backend Laravel API - /api routes
    location /api {
        alias /var/www/kasir-web/backend/public;
        try_files $uri $uri/ @api;
        
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/kasir-web/backend/public/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }
    
    location @api {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/kasir-web/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }
    
    # Backend Laravel - /sanctum routes
    location /sanctum {
        alias /var/www/kasir-web/backend/public;
        try_files $uri $uri/ @sanctum;
        
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/kasir-web/backend/public/index.php;
        }
    }
    
    location @sanctum {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/kasir-web/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }
    
    # Frontend - Aplikasi Kasir
    location ^~ /kasir {
        alias /var/www/kasir-web/frontend/dist;
        try_files $uri $uri/ /kasir/index.html;
    }
    
    # Frontend - Vue.js Inventory App
    location / {
        root /var/www/kasir-web/inventory-app/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/kasir-web/inventory-app/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Deny access to hidden files except .well-known (for Let's Encrypt)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to sensitive files
    location ~ /\.(env|git|gitignore|htaccess) {
        deny all;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
