version: '3.8'

services:
  # Laravel Octane Backend
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.octane
    container_name: kasir-octane-app
    restart: unless-stopped
    expose:
      - "8000"  # Internal only
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_DATABASE=kasir_pos
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
    networks:
      - kasir-network
    depends_on:
      - db

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: kasir-nginx-octane
    restart: unless-stopped
    ports:
      - "80:80"  # Akses: http://localhost
    volumes:
      # Mount static files untuk performance
      - ./backend/public:/var/www/public:ro
      - ./nginx/octane.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kasir-network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: kasir-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kasir_pos
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - kasir-network

networks:
  kasir-network:
    driver: bridge

volumes:
  db_data:
    driver: local
