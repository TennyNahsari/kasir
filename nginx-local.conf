# Nginx Configuration Template - Local Network (No Domain)
# File: /etc/nginx/sites-available/kasir-pos-local
#
# Untuk deployment di server lokal tanpa domain
# Akses melalui IP: http://192.168.1.100
#
# CARA PAKAI:
# 1. Ganti '192.168.1.100' dengan IP server Anda
# 2. sudo cp nginx-local.conf /etc/nginx/sites-available/kasir-pos-local
# 3. sudo ln -s /etc/nginx/sites-available/kasir-pos-local /etc/nginx/sites-enabled/
# 4. sudo nginx -t
# 5. sudo systemctl restart nginx
# 6. Update .env:
#    Frontend: VITE_API_URL=http://192.168.1.100/api
#    Backend: APP_URL=http://192.168.1.100
#             SANCTUM_STATEFUL_DOMAINS=192.168.1.100

server {
    listen 80;
    listen [::]:80;
    server_name 192.168.1.100;  # Ganti dengan IP server Anda
    
    root /var/www/kasir-pos/frontend/dist;
    index index.html;
    
    # Max upload size
    client_max_body_size 50M;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Frontend - Vue.js SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Backend API - Laravel
    location /api {
        alias /var/www/kasir-pos/backend/public;
        try_files $uri $uri/ @backend;
        
        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/kasir-pos/backend/public/index.php;
            include fastcgi_params;
            
            # Prevent timeout for long requests
            fastcgi_read_timeout 300;
        }
    }
    
    location @backend {
        rewrite /api/(.*)$ /index.php?/$1 last;
    }
    
    # Storage files (uploads)
    location /storage {
        alias /var/www/kasir-pos/backend/storage/app/public;
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to PHP files in storage
    location ~ ^/storage/.*\.php$ {
        deny all;
    }
    
    # Logging
    access_log /var/log/nginx/kasir-pos-access.log;
    error_log /var/log/nginx/kasir-pos-error.log;
}

# ======================================
# Alternative: Multiple Outlets
# ======================================
# Jika ada banyak outlet dengan server terpisah,
# bisa pakai konfigurasi yang sama tapi ganti IP

# Outlet 1: http://192.168.1.101
