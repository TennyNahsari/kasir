version: '3.8'

services:
  # Laravel Application (PHP-FPM)
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kasir-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      # Mount backend folder ke container
      - ./backend:/var/www
    environment:
      - DB_HOST=db
      - DB_DATABASE=kasir_pos
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
    networks:
      - kasir-network
    depends_on:
      - db

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: kasir-nginx
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP
      - "443:443"    # HTTPS (jika ada SSL)
    volumes:
      # Mount folder backend (untuk akses ke files)
      - ./backend:/var/www
      # Mount konfigurasi Nginx custom kita
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - kasir-network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: kasir-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kasir_pos
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      # Persistent database storage
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - kasir-network

networks:
  kasir-network:
    driver: bridge

volumes:
  db_data:
    driver: local
