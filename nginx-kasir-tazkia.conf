# Nginx Configuration for kasir.tazkia.web.id
# Single Domain Deployment (Frontend Vue.js + Backend Laravel API)

server {
    listen 80;
    listen [::]:80;
    server_name kasir.tazkia.web.id;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kasir.tazkia.web.id;

    # SSL Certificate (Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/kasir.tazkia.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kasir.tazkia.web.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Root for Frontend SPA
    root /var/www/kasir-web/frontend/dist;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 50M;

    # 1. Backend Laravel API (/api)
    location /api {
        alias /var/www/kasir-web/backend/public;
        try_files $uri $uri/ @backend;

        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/kasir-web/backend/public/index.php;
            include fastcgi_params;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param HTTPS on;
        }
    }

    # Fallback to Laravel for /api requests (Fixes 405 Method Not Allowed)
    location @backend {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/kasir-web/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS on;
    }

    # 2. Storage files (uploads/images)
    location /storage {
        alias /var/www/kasir-web/backend/storage/app/public;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 3. Frontend Vue.js SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 4. Cache Static Assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logging
    access_log /var/log/nginx/kasir-tazkia-access.log;
    error_log /var/log/nginx/kasir-tazkia-error.log;
}
