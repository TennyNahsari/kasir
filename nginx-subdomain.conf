# Nginx Configuration Template - Subdomain Terpisah
#
# Frontend: app.yourdomain.com
# Backend API: api.yourdomain.com
#
# CARA PAKAI:
# 1. Buat 2 file:
#    /etc/nginx/sites-available/kasir-pos-frontend
#    /etc/nginx/sites-available/kasir-pos-backend
# 2. Ganti 'yourdomain.com' dengan domain Anda
# 3. Ganti path project sesuai lokasi Anda
# 4. Enable sites:
#    sudo ln -s /etc/nginx/sites-available/kasir-pos-frontend /etc/nginx/sites-enabled/
#    sudo ln -s /etc/nginx/sites-available/kasir-pos-backend /etc/nginx/sites-enabled/
# 5. sudo nginx -t && sudo systemctl restart nginx
# 6. Jangan lupa update .env:
#    Frontend: VITE_API_URL=https://api.yourdomain.com/api
#    Backend: SANCTUM_STATEFUL_DOMAINS=app.yourdomain.com

# ==================================================
# File: /etc/nginx/sites-available/kasir-pos-frontend
# ==================================================

server {
    listen 80;
    listen [::]:80;
    server_name app.yourdomain.com;
    
    root /var/www/kasir-pos/frontend/dist;
    index index.html;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Frontend - Vue.js SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Logging
    access_log /var/log/nginx/kasir-pos-frontend-access.log;
    error_log /var/log/nginx/kasir-pos-frontend-error.log;
}

