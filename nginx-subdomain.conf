# ==================================================
# File: /etc/nginx/sites-available/kasir-pos-backend
# ==================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;
    
    root /var/www/kasir-pos/backend/public;
    index index.php;
    
    # Max upload size
    client_max_body_size 50M;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Prevent timeout for long requests
        fastcgi_read_timeout 300;
    }
    
    # Storage files
    location /storage {
        alias /var/www/kasir-pos/backend/storage/app/public;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to PHP files in storage
    location ~ ^/storage/.*\.php$ {
        deny all;
    }
    
    # Logging
    access_log /var/log/nginx/kasir-pos-backend-access.log;
    error_log /var/log/nginx/kasir-pos-backend-error.log;
}

